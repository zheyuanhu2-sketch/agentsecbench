[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentsecbench"
version = "0.9.0"
description = "A deterministic security benchmark for tool-using AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Zheyuan Hu" }]
keywords = ["ai-agents", "benchmark", "prompt-injection", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Changelog = "https://github.com/zheyuanhu2-sketch/agentsecbench/blob/main/CHANGELOG.md"
Issues = "https://github.com/zheyuanhu2-sketch/agentsecbench/issues"
Repository = "https://github.com/zheyuanhu2-sketch/agentsecbench"

[project.scripts]
agentsecbench = "agentsecbench.cli:main"

[dependency-groups]
dev = [
  "mypy>=2.3,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentsecbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentsecbench"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["agentsecbench"]

[tool.coverage.report]
fail_under = 90
show_missing = true
