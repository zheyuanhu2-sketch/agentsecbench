name: Bug report
description: Report a reproducible defect using synthetic data only.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic data only. Remove credentials, personal data, provider responses, and
        machine-specific secrets before submitting. Security vulnerabilities belong in a private
        security report, not this form.
  - type: input
    id: version
    attributes:
      label: AgentSecBench version or commit
      placeholder: "1.0.0 or a full commit SHA"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and operating system
      placeholder: "Python 3.13.5 on Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Minimal command or API reproduction
      description: Do not include keys, endpoints containing workspace IDs, or raw model content.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: This report contains synthetic data only and no credentials or personal data.
          required: true
        - label: I checked that this is not a vulnerability requiring private disclosure.
          required: true
