name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  static:
    name: static and contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src scripts
      - name: Check GitHub Actions workflows
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" actionlint
          chmod 0755 actionlint
          ./actionlint
      - run: uv run python scripts/release_gate.py source
      - run: uv run agentsecbench compare

  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --dev
      - run: uv run pytest --cov=agentsecbench --cov-report=term-missing

  security:
    name: dependency and complete-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv audit --locked
      - name: Install checksum-pinned Gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" gitleaks
          chmod 0755 gitleaks
      - run: ./gitleaks git --redact --no-banner --verbose .

  build:
    name: reproducible package and clean install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked --dev
      - name: Build twice from a fixed source epoch
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          uv build --out-dir "$RUNNER_TEMP/agentsecbench-dist-a" --no-create-gitignore
          uv build --out-dir "$RUNNER_TEMP/agentsecbench-dist-b" --no-create-gitignore
      - run: uv run python scripts/release_gate.py artifacts "$RUNNER_TEMP/agentsecbench-dist-a"
      - run: uv run python scripts/release_gate.py artifacts "$RUNNER_TEMP/agentsecbench-dist-b"
      - run: >
          uv run python scripts/release_gate.py compare
          "$RUNNER_TEMP/agentsecbench-dist-a"
          "$RUNNER_TEMP/agentsecbench-dist-b"
      - name: Install and execute the wheel in an isolated environment
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/agentsecbench-release-venv"
          uv pip install \
            --python "$RUNNER_TEMP/agentsecbench-release-venv/bin/python" \
            "$RUNNER_TEMP/agentsecbench-dist-a/"*.whl
          "$RUNNER_TEMP/agentsecbench-release-venv/bin/agentsecbench" compare
