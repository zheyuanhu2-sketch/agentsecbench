name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unpublished exact semantic-version tag to recover.
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  UV_NO_PROGRESS: "1"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  release:
    name: validate and publish checksummed GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate immutable unpublished release target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release target is not an exact semantic-version tag." >&2
            exit 1
          fi
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; published assets are immutable." >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked --dev
      - run: uv run python scripts/release_gate.py source --tag "${RELEASE_TAG}"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src scripts
      - name: Check GitHub Actions workflows
        run: |
          tool_dir="$RUNNER_TEMP/agentsecbench-tools"
          mkdir -p "$tool_dir"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$tool_dir/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_ARCHIVE_SHA256}  $tool_dir/$archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$tool_dir/$archive" \
            --directory "$tool_dir" actionlint
          chmod 0755 "$tool_dir/actionlint"
          "$tool_dir/actionlint"
      - run: uv run pytest --cov=agentsecbench --cov-report=term-missing
      - run: uv run python scripts/showcase.py check
      - run: uv run agentsecbench compare
      - run: uv audit --locked
      - name: Run checksum-pinned Gitleaks over complete history
        run: |
          tool_dir="$RUNNER_TEMP/agentsecbench-tools"
          mkdir -p "$tool_dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$tool_dir/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_ARCHIVE_SHA256}  $tool_dir/$archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$tool_dir/$archive" \
            --directory "$tool_dir" gitleaks
          chmod 0755 "$tool_dir/gitleaks"
          "$tool_dir/gitleaks" git --redact --no-banner --verbose .
      - name: Require clean source tree before build
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Build twice from a fixed source epoch
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          uv build --python 3.11 \
            --out-dir "$RUNNER_TEMP/agentsecbench-dist-a" --no-create-gitignore
          uv build --python 3.11 \
            --out-dir "$RUNNER_TEMP/agentsecbench-dist-b" --no-create-gitignore
      - run: uv run python scripts/release_gate.py artifacts "$RUNNER_TEMP/agentsecbench-dist-a"
      - run: uv run python scripts/release_gate.py artifacts "$RUNNER_TEMP/agentsecbench-dist-b"
      - run: >
          uv run python scripts/release_gate.py compare
          "$RUNNER_TEMP/agentsecbench-dist-a"
          "$RUNNER_TEMP/agentsecbench-dist-b"
      - name: Prepare checksummed release files
        run: |
          mkdir "$RUNNER_TEMP/agentsecbench-release"
          cp \
            "$RUNNER_TEMP/agentsecbench-dist-a/"*.whl \
            "$RUNNER_TEMP/agentsecbench-dist-a/"*.tar.gz \
            "$RUNNER_TEMP/agentsecbench-release/"
          uv run python scripts/release_gate.py checksums \
            "$RUNNER_TEMP/agentsecbench-dist-a" \
            "$RUNNER_TEMP/agentsecbench-release/SHA256SUMS"
          cd "$RUNNER_TEMP/agentsecbench-release"
          sha256sum --check SHA256SUMS --strict
      - name: Verify the release wheel in an isolated environment
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/agentsecbench-release-venv"
          uv pip install \
            --python "$RUNNER_TEMP/agentsecbench-release-venv/bin/python" \
            "$RUNNER_TEMP/agentsecbench-release/"*.whl
          "$RUNNER_TEMP/agentsecbench-release-venv/bin/agentsecbench" compare
      - name: Publish SLSA provenance attestations
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: ${{ runner.temp }}/agentsecbench-release/SHA256SUMS
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "${RELEASE_TAG}" \
            "$RUNNER_TEMP/agentsecbench-release/"* \
            --verify-tag \
            --title "AgentSecBench ${RELEASE_TAG}" \
            --generate-notes
