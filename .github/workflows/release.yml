name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_NO_PROGRESS: "1"
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  release:
    name: validate and publish checksummed GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked --dev
      - run: uv run python scripts/release_gate.py source --tag "${GITHUB_REF_NAME}"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src scripts
      - name: Check GitHub Actions workflows
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" actionlint
          chmod 0755 actionlint
          ./actionlint
      - run: uv run pytest --cov=agentsecbench --cov-report=term-missing
      - run: uv run agentsecbench compare
      - run: uv audit --locked
      - name: Run checksum-pinned Gitleaks over complete history
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" gitleaks
          chmod 0755 gitleaks
          ./gitleaks git --redact --no-banner --verbose .
      - name: Build twice from a fixed source epoch
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          uv build --out-dir "$RUNNER_TEMP/agentsecbench-dist-a" --no-create-gitignore
          uv build --out-dir "$RUNNER_TEMP/agentsecbench-dist-b" --no-create-gitignore
      - run: uv run python scripts/release_gate.py artifacts "$RUNNER_TEMP/agentsecbench-dist-a"
      - run: uv run python scripts/release_gate.py artifacts "$RUNNER_TEMP/agentsecbench-dist-b"
      - run: >
          uv run python scripts/release_gate.py compare
          "$RUNNER_TEMP/agentsecbench-dist-a"
          "$RUNNER_TEMP/agentsecbench-dist-b"
      - name: Prepare checksummed release files
        run: |
          mkdir "$RUNNER_TEMP/agentsecbench-release"
          cp \
            "$RUNNER_TEMP/agentsecbench-dist-a/"*.whl \
            "$RUNNER_TEMP/agentsecbench-dist-a/"*.tar.gz \
            "$RUNNER_TEMP/agentsecbench-release/"
          uv run python scripts/release_gate.py checksums \
            "$RUNNER_TEMP/agentsecbench-dist-a" \
            "$RUNNER_TEMP/agentsecbench-release/SHA256SUMS"
          cd "$RUNNER_TEMP/agentsecbench-release"
          sha256sum --check SHA256SUMS --strict
      - name: Verify the release wheel in an isolated environment
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/agentsecbench-release-venv"
          uv pip install \
            --python "$RUNNER_TEMP/agentsecbench-release-venv/bin/python" \
            "$RUNNER_TEMP/agentsecbench-release/"*.whl
          "$RUNNER_TEMP/agentsecbench-release-venv/bin/agentsecbench" compare
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "${GITHUB_REF_NAME}" \
            "$RUNNER_TEMP/agentsecbench-release/"* \
            --verify-tag \
            --title "AgentSecBench ${GITHUB_REF_NAME}" \
            --generate-notes
